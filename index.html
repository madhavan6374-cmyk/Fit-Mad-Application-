/* Enhanced visual system */
*{transition-property:background-color,border-color,color,box-shadow,transform,opacity;transition-duration:.22s;transition-timing-function:cubic-bezier(.2,.8,.2,1)}
button,.btn,.item,.card,.q,.kpi,.periodcard,.workout-row,.weight-row,.calcell,.seg button,.bottom button,.drawer nav button{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background-color .22s ease,border-color .22s ease,color .22s ease}
button:active,.btn:active{transform:scale(.96)}
.card:hover,.q:hover,.kpi:hover,.periodcard:hover,.workout-row:hover,.weight-row:hover{transform:translateY(-2px);box-shadow:0 16px 34px #17264a18}
.screen.active{animation:screenIn .42s cubic-bezier(.16,1,.3,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.top{transition:background-color .3s ease,border-color .3s ease,box-shadow .3s ease}
.score{animation:ringBreath 3.2s ease-in-out infinite,scoreIn .65s cubic-bezier(.16,1,.3,1)}
@keyframes scoreIn{from{opacity:0;transform:scale(.7) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.theme{box-shadow:0 5px 16px #0001}
.home-appearance{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.appearance-copy b{display:block;font-size:12px}.appearance-copy small{display:block;color:var(--muted);font-size:8px;margin-top:2px}
.appearance-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:5px 9px 5px 5px;font-size:9px;font-weight:800}
.appearance-btn i{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--card);box-shadow:0 4px 10px #0002;font-style:normal}
.appearance-btn.dark i{transform:rotate(180deg)}
.water-visual{position:relative;width:180px;height:180px;margin:8px auto 12px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 25%,#fff8,#ffffff10 18%,transparent 38%),linear-gradient(145deg,#69d5ff33,#258df033);border:1px solid #ffffff35;box-shadow:inset 0 0 30px #fff3,0 16px 35px #258df033}
.water-visual .water-level{position:absolute;left:-15%;bottom:-8%;width:130%;height:var(--water);background:linear-gradient(180deg,#69d5ffb8,#258df0e8);border-radius:48% 48% 0 0;transition:height .8s cubic-bezier(.16,1,.3,1)}
.water-visual .wave1,.water-visual .wave2{position:absolute;left:-25%;bottom:calc(var(--water) - 8px);width:150%;height:30px;border-radius:50%;background:#a8e9ff99;animation:waterWave 3.5s linear infinite}
.water-visual .wave2{bottom:calc(var(--water) - 3px);opacity:.5;animation-duration:5.5s;animation-direction:reverse}
@keyframes waterWave{to{transform:translateX(55px) rotate(3deg)}}
.bubble{position:absolute;border-radius:50%;background:#ffffff55;box-shadow:0 0 8px #fff6;animation:floatBubble 4s ease-in infinite}
.b1{width:8px;height:8px;left:28%;bottom:25%;animation-delay:.2s}.b2{width:5px;height:5px;left:62%;bottom:18%;animation-delay:1s}.b3{width:10px;height:10px;left:48%;bottom:32%;animation-delay:1.7s}
@keyframes floatBubble{0%{transform:translateY(18px);opacity:0}20%{opacity:.8}100%{transform:translateY(-90px) translateX(18px);opacity:0}}
.water-visual .water-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:3;color:#fff;text-shadow:0 2px 8px #064b8b88}
.water-visual .water-label b{font-size:31px;display:block}.water-visual .water-label small{font-size:8px}
.water-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.water-actions button{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 5px;font-size:9px;font-weight:800}
.water-actions button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.analysis-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.analysis-card{min-height:105px}
.analysis-card b{font-size:21px;display:block;margin-top:6px}
.analysis-card small{color:var(--muted);font-size:8px}
.mini-bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.mini-bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--blue));transition:width .7s cubic-bezier(.16,1,.3,1)}
.streak-hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.streak-number{font-size:42px;font-weight:900;letter-spacing:-.07em}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{padding:13px;border:1px solid var(--line);border-radius:17px;background:var(--card);text-align:center}
.badge .badge-icon{font-size:28px;display:block;margin-bottom:6px;filter:drop-shadow(0 5px 8px #0002)}
.badge.unlocked{border-color:color-mix(in srgb,var(--teal) 45%,var(--line));background:color-mix(in srgb,var(--teal) 7%,var(--card))}
.badge.locked{opacity:.48;filter:grayscale(.7)}
.trend-list{display:grid;gap:7px}
.trend-row{display:grid;grid-template-columns:76px 1fr 45px;gap:7px;align-items:center;font-size:8px}
.trend-row strong{text-align:right}
@media(max-width:520px){.planner-actions{grid-template-columns:repeat(2,1fr)}}@media(max-width:380px){.analysis-grid,.badges{grid-template-columns:1fr}.water-visual{width:160px;height:160px}}

/* Responsive device modes: Android / iPad / Laptop */
:root{--device-mode:auto}
html[data-device-mode="android"] body{--device-max:430px}
html[data-device-mode="ipad"] body{--device-max:1024px}
html[data-device-mode="laptop"] body{--device-max:1440px}
body{min-width:0}
.app-shell,.topin,.app{max-width:var(--device-max,1440px)}
.topin{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.app{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));}
.device-switch{display:flex;gap:4px;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:13px;padding:3px}
.device-switch button{width:30px;height:30px;border:0;background:transparent;border-radius:9px;font-size:13px;color:var(--muted);padding:0}
.device-switch button.active{background:var(--card);color:var(--blue);box-shadow:0 3px 8px #0001}
.topin .device-switch{flex:none}
@media(min-width:700px){
  .app{padding-top:18px}
  .quick,.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .analysis-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .badges{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bottom{max-width:min(var(--device-max,1024px),100%);padding-left:14px;padding-right:14px}
  .drawer{width:min(380px,38vw)}
}
@media(min-width:1100px){
  .app{padding-left:24px;padding-right:24px}
  .topin{padding-left:24px;padding-right:24px}
  .bottom{grid-template-columns:repeat(4,120px);justify-content:center}
  .drawer-open .app-shell{transform:translateX(300px) scale(.96)}
}
@media(max-width:699px){
  .device-switch button{width:28px;height:28px}
  .datetime{display:block;flex:0 0 auto;text-align:right;margin-left:2px}
  .datetime b{font-size:9px;line-height:1;white-space:nowrap}
  .datetime small{display:none}
  .topin{gap:6px}
}
@media(max-width:380px){
  .datetime b{font-size:8px}
  .brand small{display:none}
  .device-switch button{width:25px;height:25px}
  .device-switch{padding:2px}
  .theme{width:42px}
}
@media(max-width:430px){
  .brand b{font-size:13px}
  .brand small{font-size:7px}
}
@media(min-width:701px) and (max-width:1100px){
  .app{max-width:1024px}
}

<script id="fitmad-clean-feedback-v2">
(function(){
  'use strict';
  let audio=null;
  let last=0;

  function soundOn(){return typeof db!=='undefined' && db.sound===true}
  function hapticOn(){return typeof db!=='undefined' && db.haptic===true}

  function stopSound(){
    try{if(audio&&audio.state!=='closed')audio.suspend()}catch(e){}
  }
  function stopHaptic(){
    try{if(navigator.vibrate)navigator.vibrate(0)}catch(e){}
  }

    if(!soundOn())return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    try{
      if(!audio||audio.state==='closed')audio=new AC();
      const run=()=>{
        if(!soundOn()||audio.state==='closed')return;
        const now=audio.currentTime;
        const q={
          soft:[520,'sine',.075,.035],

          tick:[420,'square',.045,.022]

        o.type=q[1];
        o.frequency.setValueAtTime(q[0],now);
        o.frequency.exponentialRampToValueAtTime(q[0]*1.16,now+q[2]*.55);
        g.gain.setValueAtTime(.0001,now);
        g.gain.exponentialRampToValueAtTime(q[3],now+.006);
        g.gain.exponentialRampToValueAtTime(.0001,now+q[2]);
        o.connect(g);g.connect(audio.destination);
        o.start(now);o.stop(now+q[2]+.01);
      };
      if(audio.state==='suspended')audio.resume().then(run).catch(()=>{});
      else run();
    }catch(e){}
  }

  function vibrate(){
    if(!hapticOn()||!navigator.vibrate)return;
    const level=db.hapticLevel||'medium';
    const p=level==='low'?[8]:level==='high'?[30,12,45]:[16,10,25];
    try{navigator.vibrate(p)}catch(e){}
  }

  function feedback(el){
    if(!el||el.disabled||el.closest('[data-fm56-toggle],[data-setting]'))return;
    const now=Date.now();
    if(now-last<90)return;
    last=now;
    if(soundOn())play(db.soundChoice||'soft');
    if(hapticOn())vibrate();
  }

  document.addEventListener('click',function(e){
    const toggle=e.target.closest('[data-fm56-toggle]');
    if(toggle){
      const key=toggle.dataset.fm56Toggle;
      setTimeout(function(){
        if(key==='sound'&&!soundOn())stopSound();
        if(key==='haptic'&&!hapticOn())stopHaptic();
      },0);
      return;
    }

    const sp=e.target.closest('[data-fm56-sound]');
    if(sp){if(soundOn())play(sp.dataset.fm56Sound||db.soundChoice||'soft');return}
    const hp=e.target.closest('[data-fm56-haptic]');
    if(hp){if(hapticOn())vibrate();return}

    const button=e.target.closest('button,[role="button"]');
    if(button)feedback(button);
  },true);

  window.fm64PreviewSound=function(style){
    if(soundOn())play(style||db.soundChoice||'soft');
  };
  window.fm64PreviewHaptic=function(){
    if(hapticOn())vibrate();
  };

  setInterval(function(){
    if(typeof db==='undefined')return;
    if(!soundOn())stopSound();
    if(!hapticOn())stopHaptic();
  },750);
})();

window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}});

/* FIT_MAD_VIEW_STATE: remember the exact section + selected date. */
window.addEventListener('pagehide',persistViewState);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')persistViewState();
});

document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{try{restoreViewState();render()}catch(e){}},50));
</script>
</body></html>
